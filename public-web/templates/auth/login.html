{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card glass">
  <h1 class="font-display" style="font-size:1.5rem;text-align:center;margin-bottom:1.5rem;">Welcome Back</h1>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Username / Email / Mobile</label>
      <input type="text" name="identifier" required autofocus placeholder="Enter username, email or mobile">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="Your password">
    </div>
    <button type="submit" class="btn btn-neon" style="width:100%;justify-content:center;">Login</button>
  </form>
  <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem;color:var(--text-muted);">
    Don't have an account? <a href="{{ url_for('register') }}">Register</a>
  </p>
</div>
{% endblock %}
