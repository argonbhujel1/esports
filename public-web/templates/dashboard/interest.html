{% extends "base.html" %}
{% block title %}Your Interests{% endblock %}
{% block content %}
<section class="section" style="padding-top:6rem;text-align:center;">
  <h1 class="font-display" style="font-size:1.8rem;margin-bottom:0.5rem;">What are you most interested in?</h1>
  <p class="text-muted" style="margin-bottom:2rem;">Select games you love — we'll personalize your experience.</p>
  <form method="POST" class="glass" style="padding:2rem;max-width:520px;margin:0 auto;text-align:left;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for g in games %}
    <label style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem;margin-bottom:0.5rem;border-radius:8px;cursor:pointer;" class="glass">
      <input type="checkbox" name="interests" value="{{ g.slug }}">
      <span>{{ g.name }}</span>
    </label>
    {% else %}
    <label style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem;"><input type="checkbox" name="interests" value="free-fire"> Free Fire</label>
    <label style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem;"><input type="checkbox" name="interests" value="pubg-mobile"> PUBG Mobile</label>
    <label style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem;"><input type="checkbox" name="interests" value="efootball"> eFootball</label>
    <label style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem;"><input type="checkbox" name="interests" value="mobile-legends"> Mobile Legends</label>
    {% endfor %}
    <button type="submit" class="btn btn-neon btn-block" style="margin-top:1.25rem;">Continue to Dashboard</button>
  </form>
</section>
{% endblock %}
