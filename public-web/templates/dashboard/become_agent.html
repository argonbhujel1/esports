{% extends "base.html" %}
{% block title %}Become Agent{% endblock %}
{% block content %}
<div class="dash-layout">
  <aside class="sidebar glass-strong">
    <a href="{{ url_for('dashboard') }}">Overview</a>
    <a href="{{ url_for('wallet_page') }}">Wallet</a>
    <a href="{{ url_for('become_agent') }}" class="active">Become Agent</a>
    <a href="{{ url_for('profile') }}">Profile</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </aside>
  <main class="dash-content">
    <h1 class="font-display" style="font-size:1.5rem;margin-bottom:1rem;">Request to be Agent</h1>
    <p class="text-muted" style="margin-bottom:1.5rem;">Apply to become an agent. Admin will review your application.</p>
    <form method="POST" class="glass" style="padding:1.5rem;max-width:480px;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>Full Name</label><input type="text" name="full_name" value="{{ current_user.full_name or '' }}" required></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ current_user.email or '' }}"></div>
      <div class="form-group"><label>Mobile</label><input type="text" name="mobile" value="{{ current_user.mobile or '' }}"></div>
      <div class="form-group"><label>Address</label><input type="text" name="address" placeholder="Your address"></div>
      <button type="submit" class="btn btn-neon btn-block">Submit Application</button>
    </form>
  </main>
</div>
{% endblock %}
