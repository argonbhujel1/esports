{% extends "base.html" %}
{% block title %}Submit Result{% endblock %}
{% block content %}
<section class="section" style="padding-top:6rem;">
  <h1 class="font-display" style="font-size:1.5rem;margin-bottom:1rem;">Submit Match Result — {{ room.name }}</h1>
  <p class="text-muted" style="margin-bottom:1rem;">Select winner. Admin will review and load prize to winner wallet.</p>
  <form method="POST" class="glass" style="padding:1.5rem;max-width:480px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Winner</label>
      <select name="winner_user_id" required>
        <option value="">Select player</option>
        {% for p in players %}
        <option value="{{ p.user_id }}">
          {{ (p.user.full_name or p.user.username) if p.user else p.user_id }}
          {% if p.game_uid %} (ID: {{ p.game_uid }}){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Notes (optional)</label><textarea name="notes" rows="3" placeholder="Match details"></textarea></div>
    <button type="submit" class="btn btn-neon btn-block">Submit for Admin Review</button>
  </form>
</section>
{% endblock %}
