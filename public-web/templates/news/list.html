{% extends "base.html" %}
{% block title %}News{% endblock %}
{% block content %}
<section class="section" style="padding-top:6rem;">
  <div class="section-header"><h1 class="section-title">📰 News</h1></div>
  <div class="grid-2">
    {% for item in news %}
    <div class="card glass">
      <h3 style="font-weight:600;">{{ item.title }}</h3>
      <p class="text-muted" style="font-size:.85rem;margin-top:.5rem;">{{ item.content[:120] }}…</p>
      <p style="font-size:.75rem;margin-top:.75rem;" class="text-muted">{{ item.published_at.strftime('%d %b %Y') if item.published_at else '' }}</p>
    </div>
    {% else %}
    <p class="text-muted">No news published yet.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
