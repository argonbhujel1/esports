{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1>Agent Profile</h1>
<div style="background:#161b22;padding:1.5rem;border-radius:10px;border:1px solid #21262d;max-width:480px;margin-top:1rem;">
  <p><strong>Username:</strong> {{ current_user.username }}</p>
  <p style="margin-top:.5rem;"><strong>Status:</strong> {{ agent.status }}</p>
  <p style="margin-top:.5rem;"><strong>Commission Rate:</strong> {{ agent.commission_rate }}%</p>
  <hr style="border-color:#21262d;margin:1rem 0;">
  <h3 style="margin-bottom:.75rem;">My Payment QR</h3>
  <p style="color:#8b949e;font-size:.85rem;margin-bottom:.75rem;">Upload QR image file or paste URL.</p>
  <form method="POST" action="{{ url_for('update_qr') }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label style="display:block;color:#8b949e;font-size:.85rem;margin-bottom:.3rem;">Upload QR file</label>
    <input type="file" name="qr_file" accept="image/*" style="width:100%;padding:.5rem;color:#e2e8f0;margin-bottom:.75rem;">
    <label style="display:block;color:#8b949e;font-size:.85rem;margin-bottom:.3rem;">Or URL</label>
    <input type="text" name="qr_code_url" placeholder="https://res.cloudinary.com/..." style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;">
    <button type="submit" style="margin-top:.75rem;padding:.6rem 1.2rem;background:#39ff14;border:none;border-radius:6px;font-weight:600;cursor:pointer;color:#0a0a0f;">Save QR</button>
  </form>
</div>
{% endblock %}
