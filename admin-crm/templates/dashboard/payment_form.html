{% extends "base.html" %}
{% block title %}Add Payment Method{% endblock %}
{% block content %}
<h1>Add Payment Method</h1>
<form method="POST" enctype="multipart/form-data" style="max-width:420px;background:#161b22;padding:1.5rem;border-radius:10px;border:1px solid #21262d;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Name</label>
  <input name="name" required style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;">
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Type</label>
  <select name="type" style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;">
    <option value="WALLET">Wallet (eSewa/Khalti)</option>
    <option value="BANK">Bank</option>
    <option value="QR">QR Only</option>
  </select>
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Provider</label>
  <input name="provider" style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;">
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Account Name</label>
  <input name="account_name" style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;">
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Account Number</label>
  <input name="account_number" style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;">
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Upload QR Image</label>
  <input type="file" name="qr_file" accept="image/*" style="width:100%;padding:.6rem;color:#e2e8f0;">
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Or QR Image URL</label>
  <input name="qr_code_url" placeholder="https://..." style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;">
  <label style="display:block;margin:.5rem 0 .2rem;color:#8b949e;font-size:.85rem;">Instructions</label>
  <textarea name="instructions" rows="3" style="width:100%;padding:.6rem;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;"></textarea>
  <button type="submit" style="margin-top:1rem;width:100%;padding:.75rem;background:linear-gradient(135deg,#00f5ff,#b026ff);border:none;border-radius:6px;font-weight:600;cursor:pointer;">Save</button>
</form>
{% endblock %}
